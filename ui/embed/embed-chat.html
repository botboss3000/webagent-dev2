<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>__EMBED_TITLE__</title>
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/shared/css/app1.css">
<link rel="stylesheet" href="/ui/shared/css/design-system.css">
<link rel="stylesheet" href="/ui/shared/css/index.css">
<link rel="stylesheet" href="/ui/chat-widget/chat-widget.css">
<link rel="stylesheet" href="/ui/embed/embed-chat.css">
<script src="/ui/vendor/lucide/lucide.min.js"></script>
</head>
<body>
<div id="ec-root" class="ec-root chat-surface" aria-live="polite">
  <header class="ec-header cw-header">
    <span class="ec-head-icon cw-head-icon"></span>
    <div class="ec-header-text">
      <div class="ec-title cw-title" id="ec-title">Chat</div>
      <div class="ec-subtitle cw-status" id="ec-subtitle" hidden></div>
    </div>
    <span class="cw-dot idle" aria-hidden="true"></span>
    <button class="ec-close cw-icon-btn cw-close-btn" id="ec-close" type="button" aria-label="Close chat" title="Close"></button>
  </header>

  <div class="ec-messages" id="ec-messages" role="log"></div>

  <div class="ec-unavailable" id="ec-unavailable" hidden>
    <p id="ec-unavailable-text">This chat widget isn't available right now.</p>
  </div>

  <form class="ec-composer" id="ec-composer" autocomplete="off">
    <div class="chat-above-pill ec-above-pill">
      <button class="chat-activity-bar" data-footer-control="activity" type="button"><span class="chat-activity-text"></span><span class="chat-activity-chevron">›</span></button>
      <div class="chat-action-row">
        <button class="chat-stop-btn" data-footer-control="stop" id="ec-stop" type="button" hidden><span class="ec-stop-icon"></span> Stop</button>
        <button class="chat-continue-btn" data-footer-control="continue" id="ec-continue" type="button" hidden><span class="ec-continue-icon"></span> Continue</button>
      </div>
    </div>
    <div class="chat-pill ec-pill">
      <textarea id="ec-input" class="chat-pill-input ec-input" rows="1" placeholder="Type your message..."
                aria-label="Message" maxlength="4000"></textarea>
      <div class="chat-pill-stats ec-stats"></div>
      <div class="chat-pill-buttons ec-pill-buttons">
        <button class="chat-pill-voice ec-voice" type="button" aria-label="Record voice" title="Record voice"></button>
        <button class="chat-pill-send ec-send" id="ec-send" type="submit" aria-label="Send message" title="Send"></button>
      </div>
      <button class="chat-pill-attach ec-attach" type="button" aria-label="Attach files" title="Attach files"></button>
      <div class="chat-footer-handle expanded" aria-expanded="true"><div class="chat-footer-handle-line"></div></div>
    </div>
    <div class="chat-footer-row expanded ec-below-pill"><button class="chat-skills-btn" data-footer-control="abilities" type="button"><span class="ec-abilities-icon"></span><span class="csp-badge">0</span></button><button class="chat-target-btn" data-footer-control="target" type="button"><span class="ec-target-icon"></span><span class="chat-target-label"></span></button><button class="chat-mode-btn" data-footer-control="mode" type="button">Ask</button></div>
  </form>

</div>

<script type="module" src="/ui/embed/embed-chat.js"></script>
</body>
</html>
