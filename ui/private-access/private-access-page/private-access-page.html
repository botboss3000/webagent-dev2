<section class="private-access-page" aria-labelledby="private-access-title">
  <div class="private-access-glow private-access-glow-one" aria-hidden="true"></div>
  <div class="private-access-glow private-access-glow-two" aria-hidden="true"></div>

  <article class="private-access-card">
    <div class="private-access-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect width="16" height="11" x="4" y="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        <path d="M12 14v3"></path>
      </svg>
    </div>

    <p class="private-access-kicker">Private access</p>
    <h1 id="private-access-title">This app is private</h1>
    <p class="private-access-intro">
      Access is limited to people approved by this app's administrator.
    </p>

    <div class="private-access-approval" role="note">
      <span class="private-access-approval-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </span>
      <span>
        <strong>Administrator approval is required</strong>
        New registrations will remain pending administrator approval before access is granted.
      </span>
    </div>

    <button type="button" class="private-access-action" data-private-access-sign-in>
      Sign in or register
    </button>

    <p class="private-access-footnote">
      Already approved? Sign in with your existing account.
    </p>
  </article>
</section>
