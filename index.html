<!-- ── Early JS-error capture (classic, pre-module) ─────────────────────────────
     Registered BEFORE any ES module loads so it survives the one failure the
     module-level handler in ui/shared/js/main.js cannot catch: a module *link*
     error (e.g. "does not provide an export named X"). Such an error aborts the
     whole module graph at instantiation time, so main.js never evaluates and the
     error/unhandledrejection listeners it installs never exist — the SyntaxError
     then surfaces only as an uncaught console message and never reaches logs.db.
     This classic inline script runs synchronously at parse time, independent of
     the module graph, guaranteeing those failures POST to
     /api/v1/log/browser-error. main.js routes its richer banner handler through
     the same window.__reportJsError funnel below; a short message-dedupe collapses
     the two listeners firing for one event into a single logs.db row.
     KEEP: this must stay the FIRST <script> in the document and stay classic
     (NOT type="module"), or pre-boot module-link errors go uncaptured again. -->
<script>
(function () {
  var _recent = Object.create(null);   // message -> last-post epoch ms (dedupe)
  var _DEDUPE_MS = 1500;

  // Benign browser notifications that arrive as "error" events but are NOT real
  // errors and aren't actionable. "ResizeObserver loop…" is the canonical one:
  // the browser raises it whenever a ResizeObserver callback changes layout in
  // the same frame (e.g. the file-editor's resizable panes settling when the
  // File Explorer opens). Drop them so they never reach logs.db or flag the tab.
  // (Mirrored in main.js's _showJsErrorBanner for the banner path.)
  var _BENIGN = [
    /ResizeObserver loop completed with undelivered notifications/i,
    /ResizeObserver loop limit exceeded/i,
  ];
  function _isBenign(m) {
    var s = String(m || '');
    for (var i = 0; i < _BENIGN.length; i++) { if (_BENIGN[i].test(s)) return true; }
    return false;
  }

  // Single POST funnel — shared by these early listeners AND main.js's
  // _showJsErrorBanner, so identical events from both collapse to one row.
  window.__reportJsError = function (payload) {
    try {
      if (!payload || !payload.message) return;
      if (_isBenign(payload.message)) return;   // non-actionable browser noise
      var now = Date.now();
      var key = String(payload.message).slice(0, 200);
      if (_recent[key] && (now - _recent[key]) < _DEDUPE_MS) return;   // collapse duplicates
      if (Object.keys(_recent).length > 200) _recent = Object.create(null);  // bound growth
      _recent[key] = now;
      var body = {
        message: String(payload.message).slice(0, 4000),
        source: String(payload.source || '').slice(0, 200),
        level: payload.level || 'error',
        url: location.pathname + location.search,
      };
      if (payload.stack) body.stack = String(payload.stack).slice(0, 8000);
      // Correlation coords, if the app booted far enough to know them.
      if (window.app) {
        if (window.app.currentUserId)    body.user_id = window.app.currentUserId;
        if (window.app.currentSessionId) body.session_id = window.app.currentSessionId;
        if (window.app.currentAgentId)   body.agent_id = window.app.currentAgentId;
      }
      fetch('/api/v1/log/browser-error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        keepalive: true,    // still sent if the page is tearing down
      }).catch(function () {});
    } catch (_) {}
  };

  // Uncaught synchronous errors AND top-level module <script> link failures
  // (the latter dispatch a window 'error' event, not a rejection).
  window.addEventListener('error', function (e) {
    var msg = e.message || (e.error && e.error.message);
    // Resource-load errors (404 scripts, stylesheets, images, etc.) have no
    // .message — extract the failed URL from e.target so the in-app debug
    // console can show them (the browser's own console shows them, but they
    // never pass through console.* without this explicit call).
    if (!msg) {
      var target = e.target;
      if (target) {
        var failedUrl = target.src || target.href || target.data || '';
        var tagName = (target.tagName || 'RESOURCE').toLowerCase();
        var desc = 'Failed to load ' + tagName + ': ' + (failedUrl || '(unknown)');
        console.error(desc);
      }
      return;
    }
    if (_isBenign(msg)) return;   // benign browser noise — no banner, no title flag
    var src = e.filename ? (e.filename.split('/').pop() + ':' + e.lineno) : 'error';
    window.__reportJsError({ message: msg, source: src, stack: e.error && e.error.stack });
    try { document.title = '[JS ERR] ' + document.title.replace(/^\[JS ERR\] /, ''); } catch (_) {}
  });

  // Unhandled promise rejections — this is the path a failed dynamic import()
  // of the main module graph takes ("Uncaught (in promise) SyntaxError: ...").
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    var msg = (r && r.message) ? r.message : String(r);
    window.__reportJsError({ message: msg, source: 'unhandledrejection', stack: r && r.stack });
    // Also emit via console.error so the early console capture (and thus the
    // in-app debug console panel) displays it — the debug console intercepts
    // console.* calls, not window events directly.
    console.error('[unhandledrejection] ' + msg);
  });
})();
</script>
<!-- ── Early console capture (pre-module) ──────────────────────────────────
     Installed BEFORE any ES module loads so console.log/warn/error/debug calls
     produced by main.js and its dependencies during boot are NOT lost. Buffers
     into window.__earlyConsoleBuffer; debugConsole.js drains it on init and
     replaces the interceptors with its own richer ones (stack traces, server
     forwarding). The original console always sees the call, so F12 DevTools
     show everything regardless of this capture. -->
<script>
(function () {
  if (window.__earlyConsoleCaptureReady) return;
  var buffer = [];
  var levels = ['log', 'warn', 'error', 'debug'];
  var fns = {};
  levels.forEach(function (level) {
    fns[level] = console[level];
    console[level] = function () {
      // Forward to the real console (always — F12 keeps working)
      fns[level].apply(console, arguments);
      // Buffer for the debug console panel (stop once debugConsole.js drains it)
      if (window.__earlyConsoleBuffer !== null) {
        try {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function (a) {
            if (typeof a === 'string') return a;
            if (a === null) return 'null';
            if (a === undefined) return 'undefined';
            try { return JSON.stringify(a, null, 2); } catch (_) { return String(a); }
          }).join(' ');
          buffer.push({ level: level, text: text, ts: Date.now() });
          if (buffer.length > 1000) buffer.shift();
        } catch (_) {}
      }
    };
  });
  // Forward errors to the server diagnostic log (mirrors what debugConsole.js
  // does post-init, so we don't miss errors during the boot window).
  var _origError = console.error;
  console.error = function () {
    _origError.apply(console, arguments);
    try {
      var args = Array.prototype.slice.call(arguments);
      var text = args.map(function (a) {
        if (typeof a === 'string') return a;
        try { return JSON.stringify(a); } catch (_) { return String(a); }
      }).join(' ');
      if (text && text.indexOf('[WebAgent JS error]') !== 0 && typeof window.__reportJsError === 'function') {
        window.__reportJsError({ message: text, source: 'console.error(boot)', level: 'error' });
      }
    } catch (_) {}
  };
  window.__earlyConsoleBuffer = buffer;
  window.__earlyConsoleCaptureReady = true;
})();
</script>
<!-- crypto.randomUUID polyfill for insecure contexts (plain HTTP / IP access) -->
<script>
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID !== 'function') {
    crypto.randomUUID = function () {
      // RFC4122 v4 using getRandomValues (works in insecure contexts)
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const h = Array.from(b, x => x.toString(16).padStart(2, '0'));
      return `${h[0]}${h[1]}${h[2]}${h[3]}-${h[4]}${h[5]}-${h[6]}${h[7]}-${h[8]}${h[9]}-${h[10]}${h[11]}${h[12]}${h[13]}${h[14]}${h[15]}`;
    };
  }
</script>

<!-- Global border + font knobs from app-settings.json (via /api/v1/auth/ui-config).

     win the cascade and are in place before the app mounts. -->
<script>
// Coalesce the same user's short boot burst of UI-config reads. The payload is
// identity-sensitive, so the bearer token is part of the key; callers receive a
// clone and retain independent response parsing. A 10s window covers startup
// without making later settings changes stale.
(function () {
  const pending = new Map();
  window.__fetchUiConfig = function (init) {
    const options = init || {};
    const headers = options.headers || {};
    const auth = headers.Authorization || headers.authorization || 'anonymous';
    let entry = pending.get(auth);
    if (!entry) {
      entry = fetch('/api/v1/auth/ui-config', options);
      pending.set(auth, entry);
      entry.finally(() => setTimeout(() => pending.delete(auth), 10000)).catch(() => {});
    }
    return entry.then((response) => response.clone());
  };
})();
</script>

<!-- ============================================================

     ------------------------------------------------------------
     A single opaque overlay painted on the FIRST frame (the
     #boot-curtain element is the first child of <body>). It hides
     the whole boot churn — empty shell, partials injecting, theme,
     splash fade-in, session restore — so the user only ever sees a
     clean loading animation, then the finished intended view.
     Lifted by window.__boot (defined just below the element):
       • appReady()    — app shell + active tab mounted (no splash)
       • splashReady() — splash finished fading in (hand-off)
       • reveal()      — forced (server-down / safety net)
     Sits ABOVE the splash (z 2147483000) so it can hand off to it.
     Colour is var(--bg-0) so it matches the final page base in BOTH
     themes (no second flash on lift); design-system.css is loaded
     render-blocking in <head> above, so the token resolves on the
     first paint. Disabled animations under reduced-motion.
     ============================================================ -->
<style>
  #boot-curtain {
    position: fixed; inset: 0; z-index: 2147483600;
    background: #000;
    opacity: 1; transition: opacity 0.5s ease;

     glow remains a sibling, not curtain content, and returns to page level
     automatically when this curtain leaves the DOM. */

<!-- ── Boot curtain: opaque black loading cover (first child so it paints
     first). The existing sibling #cursor-glow is the sole visible boot effect;
     window.__boot below owns when this cover lifts. ───────────────────────── -->
<div id="boot-curtain" role="status" aria-label="Loading"></div>
<script>
  // Boot-curtain coordinator. Defined synchronously during parse so it exists
  // before the splash plugin (partial-loader) and main.js run. The curtain stays
  // opaque until exactly one of these lifts it:
  //   • appReady()    — app shell ready, AND no splash is taking over.
  //   • splashReady() — the splash finished fading in (hand-off; black→splash).
  //   • reveal()      — forced (server-down catch / safety net).
  // splashWillShow() lets the splash claim the reveal so appReady() defers to it.
  (function () {
    var curtainDone = false;
    var appReadyDone = false;
    var curtain = document.getElementById('boot-curtain');
    function remove() {
      if (curtain && curtain.parentNode) curtain.parentNode.removeChild(curtain);
      curtain = null;
    }
    function liftCurtain() {
      if (curtainDone) return;
      curtainDone = true;
      if (!curtain) return;
      curtain.classList.add('is-revealed');
      var t = setTimeout(remove, 700);
      curtain.addEventListener('transitionend', function (e) {
        if (e.propertyName === 'opacity') { clearTimeout(t); remove(); }
      });
    }
    function announceAppReady() {
      if (appReadyDone) return;
      appReadyDone = true;
      // The curtain is lifting → the app shell + active tab are mounted and the
      // critical boot fetches are already queued. Broadcast so non-critical,
      // decorative boot work (billing pill and recorder probe) can
      // fire NOW — queued strictly AFTER the critical calls so it loses the race
      // for the browser's ~6 HTTP/1.1 sockets instead of competing with the
      // session/message/roster loads that gate first paint. main.js listens for
      // this; the `revealed` flag covers the race where it attaches too late.
      if (window.__boot) window.__boot.revealed = true;
      try { window.dispatchEvent(new Event('webagent-app-ready')); } catch (_) {}
    }
    function reveal() {
      announceAppReady();
      liftCurtain();
    }
    window.__boot = {
      _splashPending: false,
      revealed:       false,
      // The minimum Account/Wiki shell is useful before catalogs, partials, or
      // ui-config finish. Lift only the curtain; appReady() owns readiness.
      shellReady:     liftCurtain,
      splashWillShow: function () { this._splashPending = true; },
      splashReady:    function () { reveal(); },
      appReady:       function () { if (!this._splashPending) reveal(); },
      reveal:         reveal,
    };
    // Safety net: never trap the user on the curtain if a boot step never reports.
    setTimeout(reveal, 10000);
  })();
</script>

<script>
  // ── Boot API request coalescer ──────────────────────────────────────────
  // WHY: the app boots by firing ~30 API GETs from ~15 independent modules that
  // don't coordinate, so several fetch the SAME endpoint near-simultaneously —
  // measured on a cold load: /user/profile x3, /agents x3, /auth/ui-config x3,
  // plus six more endpoints x2 (~12 of ~32 boot requests are pure duplicates).
  // The app is served over HTTP/1.1, where a browser opens only ~6 sockets per
  // origin, so each redundant GET burns a scarce socket and starves the calls
  // that actually gate first paint (sessions, messages, roster) — stretching
  // cold load to 12-17s. This shim collapses duplicate same-origin /api/ GETs:
  //   • IN-FLIGHT COALESCE (always on): a 2nd identical GET issued while the
  //     first is still pending shares that one response. A Response body can be
  //     read only once, so every caller (incl. the first) gets its own .clone();
  //     the master is never consumed. Identical to N separate GETs — same URL +
  //     idempotent method => same bytes.
  //   • SHORT TTL REPLAY (boot window only): a GET repeated within ~2s of a
  //     completed OK one replays the cached response, catching dupes that don't
  //     quite overlap. Auto-disabled ~12s after load, so steady-state fetches
  //     and background polling are never served stale.
  // SAFETY: only touches same-origin GET requests to /api/ with NO body and NO
  // AbortSignal (so one caller aborting can't cancel another's). Everything else
  // — POST/PUT, cross-origin, Request-object form, signalled, non-OK responses
  // for the TTL cache — passes straight to the real fetch. Wrapped in try/catch
  // that falls back to native fetch, so it can never break a request. Installed
  // here (classic + inline, before the first boot fetch and before any ES
  // module) so it wraps every module's fetch. KEEP after the error-capture
  // script; it must run before checkSetup() below.
  (function () {
    try {
      var _native = window.fetch ? window.fetch.bind(window) : null;
      if (!_native || window.__bootFetchCoalesced) return;
      window.__bootFetchCoalesced = true;

      var TTL_MS = 2000;          // replay a just-fetched GET within this window
      // How long the boot fast-paths (TTL replay + /boot primed cache) stay
      // active. Wide enough to still be serving the /boot snapshot when deferred
      // boot work runs after the curtain lifts, which on a slow remote-DB boot lands
      // well past 12s. The snapshot is boot-time config, so serving it for this long is
      // safe (a genuinely changed value is picked up on the next reload).
      var BOOT_WINDOW_MS = 20000;
      var bootWindowEndsAt = BOOT_WINDOW_MS;
      var inflight = new Map();   // key -> Promise<Response master>
      var cache = new Map();      // key -> { resp: Response master, at: ms }
      var _now = function () { return (window.performance && performance.now) ? performance.now() : 0; };

      // ── Combined-boot priming ────────────────────────────────────────────
      // One early GET /api/v1/boot returns the read-only page-boot payloads in a
      // single round-trip (server aggregator: app/api/boot.py). We write each
      // sub-payload into `primed`, keyed by the URL the module would otherwise
      // fetch, so the ~12 scattered boot GETs are answered from memory instead of
      // queueing behind the browser's 6-socket HTTP/1.1 cap. A module fetch that
      // races AHEAD of /boot (its key is in `expected`) waits for /boot instead of
      // hitting the network; anything not primed falls through to a real fetch, so
      // this only ever speeds boot up, never changes what loads.
      var primed = new Map();     // normKey -> Response master (whole boot window)
      var expected = new Set();   // normKeys /boot is expected to prime

  window.__getChatVisible = function () {
    try {
      if (window.__isMobileChatLayout && window.__isMobileChatLayout()) {
        return window.__getMobileActiveView() === 'chat';
      }
      var v = localStorage.getItem(window.__chatVisibilityKey());
      if (v === null) return window.__chatVisibilityDefault();
      return v !== 'false';
    } catch (_) { return window.__chatVisibilityDefault(); }
  };
  window.__applyChatVisible = function (visible, persist) {
    var chatPanel = document.getElementById('chat-panel');
    var handle = document.getElementById('chat-resize-handle');
    var btn = document.getElementById('chat-toggle-btn');
    var mainPanel = document.getElementById('main-panel');
    var isMobile = window.__isMobileChatLayout();
    // Body class drives mobile show/hide via CSS — keep inline display untouched on mobile.
    if (document.body) {
      document.body.classList.toggle('chat-visible', visible);
      document.body.classList.toggle('chat-hidden', !visible);
    }
    if (isMobile) {
      // Clear any inline display from prior desktop toggles; CSS owns visibility now.
      if (chatPanel) chatPanel.style.display = '';
      if (handle)    handle.style.display    = '';
      if (mainPanel) mainPanel.style.display = '';
    } else {
      // Desktop: chat side-by-side; toggle hides chat only.
      if (chatPanel) chatPanel.style.display = visible ? '' : 'none';
      if (handle)    handle.style.display    = visible ? '' : 'none';
      if (mainPanel) mainPanel.style.display = '';
    }
    if (btn) btn.classList.toggle('active', visible);
    var chatControls = btn && btn.closest ? btn.closest('.chat-header-controls') : null;
    if (chatControls) chatControls.classList.toggle('chat-active', visible);
    if (persist !== false) {
      try { localStorage.setItem(window.__chatVisibilityKey(), String(visible)); } catch (_) {}
    }
    // Track the mutually-exclusive mobile view so a refresh restores it. Desktop
    // chat visibility is an independent preference and must not overwrite the
    // last mobile view when the viewport crosses the breakpoint.
    if (isMobile && persist !== false) {
      window.__setMobileActiveView(visible ? 'chat' : 'main');
    }
    // Desktop: showing the chat panel focuses the input so the user can start
    // typing without an extra tap. Mobile: deliberately does NOT auto-focus —
    // revealing the chat (tapping a session in the list, restoring a session on
    // boot, or the chat toggle) must leave the composer pill in its idle form
    // with the on-screen keyboard closed. New sessions opt back IN to the focus
    // via app.focusChatInput() in session-init.js (_startNewSession), so the
    // pill activates and the keyboard opens only for a brand-new session.
    if (visible && !isMobile) {
      var ci = document.getElementById('chat-input');
      if (ci) setTimeout(function () { ci.focus(); }, 50);
    }
    // The minimize bubble only exists while the panel is hidden — any path
    // that opens the panel (toggle, tabs, agent events) clears it.
    if (window.__refreshChatBubble) window.__refreshChatBubble();
  };
  window.__toggleChat = function () {
    window.__applyChatVisible(!window.__getChatVisible());
  };

  // ── Chat minimize → floating restore bubble (desktop) ─────────────────────
  // The minimize control in the desktop chat header (data/config/chat_ui.json
  // → chat_desktop.chat_header) hides the side panel and floats a compact
  // bubble (bottom-right) that restores the SAME conversation. The hide is
  // deliberately NOT persisted, so a refresh returns to the normal panel;
  // restoring via the bubble persists like the top Chat toggle. In the embed
  // portal (app/main.py sets window.__CHAT_PORTAL__) the widget's own minimize
  // already closes the portal — this handler stays out of the way.
  window.__chatBubbleEl = null;
  window.__chatBubbleTimer = null;

  window.__removeChatBubble = function () {
    if (window.__chatBubbleTimer) { clearInterval(window.__chatBubbleTimer); window.__chatBubbleTimer = null; }
    if (window.__chatBubbleEl) { window.__chatBubbleEl.remove(); window.__chatBubbleEl = null; }
  };

  window.__refreshChatBubble = function () {
    if (!window.__chatBubbleEl) return;
    if (window.__getChatVisible()) {           // panel opened by any path
      window.__removeChatBubble();
      return;
    }
    // Pulse while the agent is working (flag set by ui/shared/js/chat-activity.js).
    window.__chatBubbleEl.classList.toggle('working', window.__agentTurnActive === true);
  };

  window.__ensureChatBubble = function () {
    if (window.__chatBubbleEl) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'chat-minimize-bubble';
    b.className = 'chat-minimize-bubble';
    b.setAttribute('aria-label', 'Open chat');
    b.title = 'Open chat';
    b.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
    b.addEventListener('click', function () {
      window.__applyChatVisible(true, true);   // restores; hook removes bubble
    });
    document.body.appendChild(b);
    window.__chatBubbleEl = b;
    // Poll the turn-active flag while the bubble lives (no event is fired on it).
    window.__chatBubbleTimer = setInterval(window.__refreshChatBubble, 1500);
    window.__refreshChatBubble();
  };

  window.__minimizeChatToBubble = function () {
    window.__applyChatVisible(false, false);   // hide, don't persist
    window.__ensureChatBubble();
  };

  document.addEventListener('chat-control:minimize', function () {
    if (window.__CHAT_PORTAL__) return;        // portal owns its minimize
    if (window.__isMobileChatLayout && window.__isMobileChatLayout()) {
      window.__toggleChat();                    // mobile: plain hide, no bubble
      return;
    }
    window.__minimizeChatToBubble();
  });

  // Resolve the chat-toggle button from an event with a triple-fallback so it
  // survives Lucide's MutationObserver swapping the inner SVG mid-interaction:
  //   1) closest() on e.target  2) walk composedPath()  3) hit-test at coords.
  function __findChatToggle(e) {
    var btn = null;
    if (e.target && e.target.closest) btn = e.target.closest('#chat-toggle-btn');
    if (!btn && typeof e.composedPath === 'function') {
      var path = e.composedPath();
      for (var i = 0; i < path.length; i++) {
        if (path[i] && path[i].id === 'chat-toggle-btn') { btn = path[i]; break; }
      }
    }
    if (!btn && typeof e.clientX === 'number') {
      var hit = document.elementFromPoint(e.clientX, e.clientY);
      if (hit && hit.closest) btn = hit.closest('#chat-toggle-btn');
    }
    return btn;
  }

  // ── Chat button: short click toggles the panel; LONG-PRESS (≥500ms) starts a
  //    fresh session with the default agent. A long press sets _lpFired, which
  //    the click handler below honours to skip the toggle that the release
  //    click would otherwise fire. _lpFired is reset on the next pointerdown,
  //    so a later short click is never wrongly swallowed. ──
  var _lpTimer = null, _lpFired = false;
  function _lpClear() { if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; } }
  document.addEventListener('pointerdown', function (e) {
    var btn = __findChatToggle(e);
    if (!btn) return;
    _lpFired = false;
    _lpClear();
    _lpTimer = setTimeout(function () {
      _lpFired = true;
      _lpClear();
      btn.classList.add('lp-active');
      setTimeout(function () { btn.classList.remove('lp-active'); }, 280);
      try {
        if (!window.__getChatVisible()) window.__applyChatVisible(true);
        if (typeof window.__startNewSessionDefault === 'function') {
          window.__startNewSessionDefault();
        }
      } catch (_) {}
    }, 500);
  }, true);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
    document.addEventListener(evt, function (e) {
      if (__findChatToggle(e)) _lpClear();
    }, true);
  });

  // The icon is the notification target only when notifications exist. At zero,
  // it remains a compact way to open/toggle chat instead of opening an empty panel.
  document.addEventListener('click', function (e) {
    var notificationBtn = e.target && e.target.closest
      ? e.target.closest('#chat-notification-toggle-btn')
      : null;
    if (notificationBtn) {
      e.stopPropagation();
      e.preventDefault();
      if (notificationBtn.classList.contains('has-notifications')
          && typeof window.__toggleSessionNotificationPanel === 'function') {
        window.__toggleSessionNotificationPanel();
      } else {
        window.__toggleChat();
      }
      return;
    }

    var btn = __findChatToggle(e);
    if (!btn) return;
    e.stopPropagation();
    e.preventDefault();
    if (_lpFired) { _lpFired = false; return; }  // long press handled it
    window.__toggleChat();
  }, true);
  // Apply visibility once DOM is ready
  function _initChatVisibility() {
    var savedVisible = window.__getChatVisible();
    // Restoration is not a user transition; leave localStorage untouched.
    window.__applyChatVisible(savedVisible, false);
    // Re-assert after synchronous boot work such as tabs.js activation.
    setTimeout(function () {
      window.__applyChatVisible(savedVisible, false);
    }, 0);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _initChatVisibility);
  } else {
    _initChatVisibility();
  }
  // Re-apply per-layout visibility on viewport crossings
  (function () {
    var lastMobile = window.__isMobileChatLayout();
    window.addEventListener('resize', function () {
      var nowMobile = window.__isMobileChatLayout();
      if (nowMobile !== lastMobile) {
        lastMobile = nowMobile;
        window.__applyChatVisible(window.__getChatVisible());
      }
    });
  })();

  // (Swipe gesture removed — was causing accidental view switches)
</script>

  <script src="./ui/shared/js/header-build.js?v=3"></script>

	      if (!navigator.serviceWorker.controller) {

<!-- ── Lucide icons + horizontal tab strip with carousel ───────── -->
<script>(function () {
  // Render all data-lucide icons in the DOM
  lucide.createIcons();

  // ── Horizontal tab strip ─────────────────────────────────────
  // The hidden <select id="main-tab-select"> is used by tabs.js.
  // This block drives the visible tab buttons + chevron carousel
  // and stays in sync when tabs change externally.

  var nativeSelect = document.getElementById('main-tab-select');
  var tabBar       = document.getElementById('main-tabs');
  var tabWrap      = document.getElementById('main-tabs-wrap');
  var chevLeft     = document.getElementById('main-tabs-chev-left');
  var chevRight    = document.getElementById('main-tabs-chev-right');
  if (!nativeSelect || !tabBar || !tabWrap) return;

  function updateChevrons() {
    if (!chevLeft || !chevRight) return;
    var overflow = tabBar.scrollWidth - tabBar.clientWidth > 1;
    tabWrap.classList.toggle('has-overflow', overflow);
    chevLeft.classList.toggle('visible', overflow && tabBar.scrollLeft > 1);
    chevRight.classList.toggle('visible', overflow && tabBar.scrollLeft < tabBar.scrollWidth - tabBar.clientWidth - 1);
  }

  function syncActive(tabId) {
    tabBar.querySelectorAll('.main-tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.value === tabId);
    });
    var activeBtn = tabBar.querySelector('.main-tab.active');
    if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    requestAnimationFrame(updateChevrons);
    setTimeout(updateChevrons, 350); // catch end of smooth scroll
  }

  // tabs.js is intentionally deferred until the minimum shell + requested
  // partial are ready. A fast click can therefore arrive before its hidden
  // select listener exists. Paint that intent immediately and leave a one-item
  // handoff for initTabs() to replay; otherwise the header changes selection
  // while the old Wiki panel remains active underneath it.
  window.__queueEarlyMainTab = function (tabId) {
    if (!tabId || window.__mainTabsRouterReady) return;
    window.__pendingMainTab = tabId;
    document.querySelectorAll('#main-panel > .tab-content').forEach(function (panel) {
      panel.classList.remove('active');
      panel.removeAttribute('aria-busy');
    });
    var target = document.getElementById('tab-' + tabId);
    if (!target) return;
    target.classList.add('active');
    target.setAttribute('aria-busy', 'true');
    var uid = (window.app && window.app.currentUserId) || '';
    try { uid = localStorage.getItem('auth_user_id') || uid; } catch (_) {}
    if (tabId === 'instances' && uid.indexOf('anon_') === 0) {
      target.removeAttribute('aria-busy');
      target.dataset.shellAccessGate = 'anonymous';
      target.innerHTML = '<section role="status" data-page-access-state="blocked" style="max-width:460px;margin:auto;padding:36px 28px;text-align:center">'
        + '<h2 style="font-size:18px;margin:0 0 10px">App is unavailable for guest chats</h2>'
        + '<p style="margin:0;color:var(--fg-3)">Sign in with an account that has access to continue.</p></section>';
    }
  };

  // Route by the button's page id once tabs.js is ready. Gated pages are
  // deliberately absent from the guest <select>, so assigning their value to
  // that select produces "" and loses the destination. The real router accepts
  // the id directly and can render its access gate without an option.
  window.__routeHeaderMainTab = function (tabId, selectEl) {
    if (!tabId) return false;
    if (window.__mainTabsRouterReady && typeof window.__routeMainTab === 'function') {
      window.__routeMainTab(tabId, true);
      return true;
    }
    window.__queueEarlyMainTab(tabId);
    if (selectEl && selectEl.querySelector('option[value="' + tabId + '"]')) {
      selectEl.value = tabId;
      selectEl.dispatchEvent(new Event('change', { bubbles: true }));
    }
    return false;
  };

  // Pick a tab — delegated on the strip so it works for buttons generated
  // (and re-generated) from the page catalog after this script runs.
  tabBar.addEventListener('click', function (e) {
    var btn = e.target.closest('.main-tab');
    if (!btn || !tabBar.contains(btn)) return;
    var val = btn.dataset.value;
    if (!val) return;
    e.__mainTabRouted = window.__routeHeaderMainTab(val, nativeSelect);
    if (e.__mainTabRouted) e.stopImmediatePropagation();
    syncActive(val);
  });

  // Let header-build.js refresh chevrons after it (re)builds the strip.
  window.__refreshTabStrip = updateChevrons;

  // Chevron carousel (matches app-config tabs pattern)
  if (chevLeft && chevRight) {
    var scrollStep = function () { return Math.max(80, Math.floor(tabBar.clientWidth * 0.6)); };
    chevLeft.addEventListener('click', function () { tabBar.scrollBy({ left: -scrollStep(), behavior: 'smooth' }); });
    chevRight.addEventListener('click', function () { tabBar.scrollBy({ left: scrollStep(), behavior: 'smooth' }); });
    tabBar.addEventListener('scroll', updateChevrons, { passive: true });

    requestAnimationFrame(function () {
      updateChevrons();
      var active = tabBar.querySelector('.main-tab.active');
      if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
    if (typeof ResizeObserver !== 'undefined') {
      var roPending = false;
      var ro = new ResizeObserver(function () {
        if (roPending) return;
        roPending = true;
        requestAnimationFrame(function () { roPending = false; updateChevrons(); });
      });
      ro.observe(tabBar);
      ro.observe(tabWrap);
    }
    window.addEventListener('resize', updateChevrons);
  }

  // ── Rubber-band overscroll for the tab carousel ──
  // Matches the footer handle's spring curve. Intercepts wheel + touch at
  // scroll boundaries and applies a diminishing translateX that snaps back
  // on release. CSS overscroll-behavior-x: none prevents native bounce from
  // competing on macOS trackpad.
  (function () {
    var _rbX = 0, _rbTimer = null;
    var MAX_PULL = 60, RESIST = 0.35;
    var SPRING = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    var _touchLastX = 0, _touchActive = false;
    var _snapping = false;
    var _snapTimeout = null;

    function _snap() {
      if (Math.abs(_rbX) < 0.5) return;
      _snapping = true;
      tabBar.style.transition = 'transform 0.45s ' + SPRING;
      _rbX = 0;
      tabBar.style.transform = '';
      clearTimeout(_rbTimer);
      _rbTimer = setTimeout(function () {
        tabBar.style.transition = '';
      }, 500);
      // Windows precision trackpad momentum can last 2+ s — keep ALL
      // wheel events suppressed for long enough that the tail is gone
      // before the rubber band re-arms. Otherwise residual momentum
      // triggers a second, weaker band after the first snap ends.
      clearTimeout(_snapTimeout);
      _snapTimeout = setTimeout(function () { _snapping = false; }, 2500);
    }

    function _pull(dx) {
      if (_snapping) return false;
      clearTimeout(_rbTimer);
      tabBar.style.transition = 'none';
      var maxS = tabBar.scrollWidth - tabBar.clientWidth;
      var atL = tabBar.scrollLeft <= 0 && dx < 0;
      var atR = tabBar.scrollLeft >= maxS - 0.5 && dx > 0;
      if (!atL && !atR) {
        if (Math.abs(_rbX) > 0.5) _snap();
        return false;
      }
      _rbX -= dx * RESIST;
      _rbX = Math.max(-MAX_PULL, Math.min(MAX_PULL, _rbX));
      tabBar.style.transform = 'translateX(' + _rbX + 'px)';
      _rbTimer = setTimeout(_snap, 120);
      return true;
    }

    // Wheel / trackpad — uses the dominant axis so a mouse wheel (which
    // produces deltaY, not deltaX) also scrolls the tab strip horizontally.
    // Boundary rubber band still fires; mid-strip, manual scrollLeft keeps
    // the page from scrolling vertically.
    tabBar.addEventListener('wheel', function (e) {
      // Pick the axis with the larger magnitude — trackpad → deltaX,
      // mouse wheel → deltaY.
      var dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (!dx) return;
      var maxS = tabBar.scrollWidth - tabBar.clientWidth;
      if (_snapping) {
        if ((tabBar.scrollLeft <= 0 && dx < 0) || (tabBar.scrollLeft >= maxS - 0.5 && dx > 0)) {
          e.preventDefault();
        }
        return;
      }
      if (_pull(dx)) { e.preventDefault(); return; }
      // Not at a boundary — scroll the strip ourselves so deltaY from a
      // physical wheel doesn't scroll the page instead.
      tabBar.scrollLeft += dx;
      e.preventDefault();
    }, { passive: false });

    // Touch — track inter-frame delta past the boundary
    tabBar.addEventListener('touchstart', function (e) {
      var t = e.touches[0];
      if (!t) return;
      _touchLastX = t.clientX;
      _touchActive = true;
    }, { passive: true });

    tabBar.addEventListener('touchmove', function (e) {
      if (!_touchActive) return;
      var t = e.touches[0];
      if (!t) return;
      var dx = _touchLastX - t.clientX;  // positive = swipe left
      _touchLastX = t.clientX;
      var maxS = tabBar.scrollWidth - tabBar.clientWidth;
      var atL = tabBar.scrollLeft <= 0 && dx < 0;
      var atR = tabBar.scrollLeft >= maxS - 0.5 && dx > 0;
      if (atL || atR) {
        clearTimeout(_rbTimer);
        tabBar.style.transition = 'none';
        _rbX -= dx * RESIST;
        _rbX = Math.max(-MAX_PULL, Math.min(MAX_PULL, _rbX));
        tabBar.style.transform = 'translateX(' + _rbX + 'px)';
        _rbTimer = setTimeout(_snap, 120);
        e.preventDefault();  // suppress native overscroll
      } else if (Math.abs(_rbX) > 0.5) {
        _snap();
      }
    }, { passive: false });

    function _touchEnd() {
      _touchActive = false;
      if (Math.abs(_rbX) > 0.5) _snap();
    }
    tabBar.addEventListener('touchend', _touchEnd, { passive: true });
    tabBar.addEventListener('touchcancel', _touchEnd, { passive: true });
  })();

  // MutationObserver: sync when tabs.js (or config menu) switches tab externally.
  // Observe the #main-panel subtree (not each .tab-content node) so it also
  // covers content mounts generated from the catalog after this script runs.
  // GUARD: lastSyncedTab means cosmetic class churn inside the panel (e.g.
  // cursor-effects.js toggling .spot-active on every pointermove) can no longer
  // re-trigger syncActive() — which re-centers the strip on the active tab via
  // scrollIntoView and would yank the carousel back from wherever the user
  // swiped. Only a REAL tab change syncs now.
  var mainPanel = document.getElementById('main-panel');
  var lastSyncedTab = '';
  if (mainPanel) {
    var observer = new MutationObserver(function () {
      var active = document.querySelector('.tab-content.active');
      if (!active) return;
      var id = active.id.replace('tab-', '');
      if (id === lastSyncedTab) return;
      lastSyncedTab = id;
      syncActive(id);
    });
    observer.observe(mainPanel, { subtree: true, attributes: true, attributeFilter: ['class'] });
  }

  // Sync to whatever tab is currently active on load
  var initActive = document.querySelector('.tab-content.active');
  if (initActive) {
    lastSyncedTab = initActive.id.replace('tab-', '');
    syncActive(lastSyncedTab);
  }

})();
</script>

<!-- ── Pull-to-refresh (top): touch-drag from the header zone. Drag to ~50% of
     screen → normal reload; keep dragging to ~85% → hard (cache-busting) reload. ── -->
<script>
(() => {
  const indicator = document.getElementById('ptr-indicator');
  const blueFill = document.getElementById('ptr-blue');
  const redFill = document.getElementById('ptr-red');
  const hint = document.getElementById('ptr-hint');
  if (!indicator || !blueFill || !redFill || !hint) return;

  const FULL_DASH = 98;
  const PULL_ZONE_PX = 50;   // only touches starting in the top N px trigger pull-to-refresh
  // Raw drag distance as fraction of screen height
  const NORMAL_AT = 0.50;   // 50% → fires normal reload
  const HARD_AT   = 0.85;   // 85% → fires hard refresh

  let dragging = false, startY = 0, stage = 0; // 0=idle, 1=refresh, 2=hard

  function ptrEnd() {
    if (!dragging) return;
    const s = stage;
    dragging = false; startY = 0; stage = 0;
    indicator.style.display = 'none';
    hint.textContent = '';
    hint.className = 'ptr-label-hint';
    if (s === 1) location.reload();
    else if (s === 2) window.location.href = window.location.pathname + '?_=' + Date.now();
  }

  document.addEventListener('touchstart', (e) => {
    if (window.scrollY > 5) return;
    const touch = e.touches[0];
    if (!touch) return;
    if (touch.clientY > PULL_ZONE_PX) return;
    dragging = true;
    startY = touch.clientY;
    stage = 0;
    indicator.style.display = '';
    indicator.style.opacity = '1';
    blueFill.setAttribute('stroke-dashoffset', String(FULL_DASH));
    blueFill.style.display = '';
    redFill.style.display = 'none';
    redFill.setAttribute('stroke-dashoffset', String(FULL_DASH));
    hint.textContent = '';
    hint.className = 'ptr-label-hint';
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const touch = e.touches[0];
    if (!touch) return;
    const raw = touch.clientY - startY;
    if (raw <= 0) { ptrEnd(); return; }

    const screenH = window.innerHeight;
    const normalPx = screenH * NORMAL_AT;
    const hardPx   = screenH * HARD_AT;

    // Rubber-band the visual extent
    const eased = raw * 0.4;
    const maxEased = screenH * 0.85;
    const visual = Math.min(eased, maxEased);
    const frac = Math.min(visual / maxEased, 1);

    if (raw >= hardPx) {
      // ── HARD REFRESH zone (raw drag ≥ 85% screen) ──
      stage = 2;
      // Blue = full
      blueFill.setAttribute('stroke-dashoffset', '0');
      // Red fills: from empty at normalPx to full at hardPx
      const redProgress = Math.min(Math.max(raw - normalPx, 0) / (hardPx - normalPx), 1);
      const redOffset = FULL_DASH * (1 - redProgress);
      redFill.style.display = '';
      redFill.setAttribute('stroke-dashoffset', String(Math.max(0, redOffset)));
      hint.textContent = 'HARD REFRESH';
      hint.className = 'ptr-label-hint show';
    } else if (raw >= normalPx) {
      // ── NORMAL REFRESH zone (50% ≤ raw < 85%) ──
      stage = 1;
      // Blue = full (offset 0)
      blueFill.setAttribute('stroke-dashoffset', '0');
      redFill.style.display = 'none';
      hint.textContent = '';
      hint.className = 'ptr-label-hint';
    } else {
      // ── IDLE zone (raw < 50%) ──
      stage = 0;
      // Blue fills proportionally based on raw / normalPx
      const blueRatio = Math.min(raw / normalPx, 1);
      const blueOffset = FULL_DASH * (1 - blueRatio);
      blueFill.setAttribute('stroke-dashoffset', String(Math.max(0, blueOffset)));
      redFill.style.display = 'none';
      hint.textContent = '';
      hint.className = 'ptr-label-hint';
    }
  }, { passive: true });

  document.addEventListener('touchend', ptrEnd, { passive: true });
  document.addEventListener('touchcancel', ptrEnd, { passive: true });
})();
</script>
