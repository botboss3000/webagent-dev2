      </div>

<!-- ── Gates ──
     App-level run-contract gates (plugins/gates/). Every gate TYPE in the gates
     directory is listed here automatically — same drop-in catalog the per-agent
     Modes page uses — and is fixed ON: gate types are discovered once at process
     start (app/agent/gate_registry.py `gate_types()`), so a type cannot be turned
     off yet (phase 1). Expand a row to edit that gate's own APP-LEVEL params
     (app-settings.json → gate_settings) — exactly the params the gate declares,
     with no generic guidance blob. The gate's resolver stacks them app-wide
     BEFORE any per-agent value appends. (closing_message's rows are its flag
     taxonomy plus the notification and output-format guidance.)
     Rendered by ../agent-settings/gates-section.js into #ac-gates-list.
     NOTE: keep this a SIBLING of #ac-cat-agent-tools (directly below the
     abilities configurations), never nested inside it. -->
<div class="ac-category-group" id="ac-cat-gates" data-pa-area="agent_tools">
    <div class="ac-category-summary">
      <i data-lucide="door-closed" class="lucide-icon ac-ico-16 ac-fg-accent"></i>
      <span class="ac-category-title">Gates</span>
      <span class="ac-category-count" id="ac-cat-gates-count"></span>
    </div>
    <div class="ac-category-body">
      <div class="ac-hint ac-mb8">
        Run-contract gates the agent loop checks while it works. Every gate in the gates directory is loaded automatically and shown on. Expand a row to set app-wide guidance for it — per-agent choices stay on each agent's Modes page.
      </div>
      <div id="ac-gates-list" class="ac-list"></div>
    </div>
</div>
