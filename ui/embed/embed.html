<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat</title>
<link rel="icon" href="../ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../ui/vendor/fonts/fonts.css">
<link rel="stylesheet" href="../ui/embed/embed.css">
</head>
<body>
<div id="embed-root">
  <div id="embed-header">
    <span id="embed-agent-icon"></span>
    <span id="embed-agent-name">Loading…</span>
  </div>
  <div id="embed-chat"></div>
  <div id="embed-input-row">
    <textarea id="embed-input" rows="1" placeholder="Type a message…"></textarea>
    <button id="embed-send-btn" title="Send" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>
<script type="module" src="../ui/embed/js/embed.js"></script>
</body>
</html>
